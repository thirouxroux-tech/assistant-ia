<!DOCTYPE html>
<html lang="fr">
<head><link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <title>Assistant IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .box {
      background: white;
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: auto;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    .result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="box">
  <h1>Assistant IA</h1>
  <p>Pose ta question :</p>

  <input id="question" placeholder="Ex : Comment mieux gérer mon temps ?" />
  <button onclick="repondre()">Envoyer</button>

  <div class="result" id="reponse"></div>

  <h3>Historique</h3>
  <ul id="historique"></ul>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function () {

    const input = document.getElementById("question");
    const reponse = document.getElementById("reponse");
    const list = document.getElementById("historique");

    let historique = JSON.parse(localStorage.getItem("historique")) || [];

    function afficherHistorique() {
      list.innerHTML = "";
      historique.forEach(q => {
        const li = document.createElement("li");
        li.textContent = q;
        list.appendChild(li);
      });
    }

    window.repondre = function () {
      const q = input.value.trim();
      if (!q) {
        alert("Écris une question");
        return;
      }

      historique.push(q);
      localStorage.setItem("historique", JSON.stringify(historique));

      reponse.innerText = "Tu as demandé : " + q;
      input.value = "";

      afficherHistorique();
    };

    afficherHistorique();
  });
</script>


</body>
</html>
