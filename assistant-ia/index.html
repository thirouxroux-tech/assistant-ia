<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Assistant IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .application {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    h1, h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    #outil {
      display: none;
    }

    #reponse {
      margin-top: 15px;
      padding: 10px;
      background: #eee;
      white-space: pre-line;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<div class="application">
  <h1>Assistant IA</h1>

  <!-- ÉCRAN D'ACCUEIL -->
  <div id="accueil">
    <p>Que voulez-vous faire ?</p>

    <button onclick="ouvrirOutil()">✍️ Écrire un texte</button>
    <button disabled>📩 Répondre à un email</button>
    <button disabled>📄 Résumer un texte</button>
    <button disabled>💡 Trouver des idées</button>
  </div>

  <!-- OUTIL ÉCRITURE -->
  <div id="outil">
    <h2>✍️ Écrire un texte</h2>

    <label>Sujet du texte</label>
    <input id="sujet" placeholder="Ex : demande de rendez-vous">

    <label>À qui s’adresse le texte</label>
    <input id="destinataire" placeholder="Ex : mon employeur">

    <label>Ton du texte</label>
    <select id="ton">
      <option value="simple">Simple</option>
      <option value="formel">Formel</option>
    </select>

    <label>Longueur</label>
    <select id="longueur">
      <option value="court">Court</option>
      <option value="moyen">Moyen</option>
    </select>

    <button onclick="genererTexte()">Générer le texte</button>
    <button onclick="copierTexte()">📋 Copier le texte</button>
    <button onclick="retour()">⬅ Retour</button>

    <div id="reponse"></div>
  </div>
</div>

<script>
function ouvrirOutil() {
  document.getElementById("accueil").style.display = "none";
  document.getElementById("outil").style.display = "block";
}

function retour() {
  document.getElementById("outil").style.display = "none";
  document.getElementById("accueil").style.display = "block";
  document.getElementById("reponse").innerText = "";
}

function genererTexte() {
  const sujet = document.getElementById("sujet").value;
  const destinataire = document.getElementById("destinataire").value;
  const ton = document.getElementById("ton").value;
  const longueur = document.getElementById("longueur").value;

  if (!sujet || !destinataire) {
    document.getElementById("reponse").innerText =
      "Merci de remplir le sujet et le destinataire.";
    return;
  }

  let texte = "";

  texte += "Bonjour,\n\n";
  texte +=
    "Je vous écris concernant " + sujet +
    ". Ce message s’adresse à " + destinataire + ".\n\n";

  if (longueur === "moyen") {
    texte +=
      "Je souhaite vous apporter davantage de précisions à ce sujet et reste à votre disposition pour toute information complémentaire.\n\n";
  }

  texte += "Cordialement.";

  document.getElementById("reponse").innerText = texte;
}

function copierTexte() {
  const texte = document.getElementById("reponse").innerText;

  if (!texte) {
    alert("Aucun texte à copier");
    return;
  }

  navigator.clipboard.writeText(texte).then(() => {
    alert("Texte copié !");
  });
}
</script>

</body>
</html>
