<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Assistant IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .application {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 16px;
      cursor: pointer;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }

    #outil {
      display: none;
    }
  </style>
</head>

<body>

<div class="application">
  <h1>Assistant IA</h1>

  <!-- ACCUEIL -->
  <div id="accueil">
    <p>Que voulez-vous faire ?</p>

    <button onclick="ouvrirOutil()">✍️ Écrire un texte</button>
    <button disabled>📩 Répondre à un email</button>
    <button disabled>📄 Résumer un texte</button>
    <button disabled>💡 Trouver des idées</button>
  </div>

  <!-- OUTIL -->
  <div id="outil">
    <p>Posez une question :</p>
    <input id="question" placeholder="Ex : écris un texte simple">

    <button onclick="repondre()">Envoyer</button>
    <button onclick="retour()">⬅ Retour</button>

    <div id="reponse" style="margin-top:15px;"></div>
  </div>
</div>

<script>
function ouvrirOutil() {
  document.getElementById("accueil").style.display = "none";
  document.getElementById("outil").style.display = "block";
}

function retour() {
  document.getElementById("outil").style.display = "none";
  document.getElementById("accueil").style.display = "block";
}

function repondre() {
  const question = document.getElementById("question").value;
  document.getElementById("reponse").innerText =
    "Vous avez demandé : " + question;
}
</script>

</body>
</html>
