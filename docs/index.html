<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Assistant IA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
    }

    header {
      background: #222;
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-around;
    }

    header button {
      background: none;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    header button:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
    }

    textarea {
      width: 100%;
      height: 140px;
      font-size: 16px;
      padding: 10px;
    }

    button.action {
      margin-top: 10px;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 15px;
      background: #eef;
      padding: 15px;
      border-radius: 5px;
      white-space: pre-line;
    }

    .short {
      margin-top: 10px;
      background: #e0ffe0;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    .history-item {
      background: #f0f0f0;
      margin-bottom: 10px;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>

<body>

<header>
  <button onclick="showPage('home')">Accueil</button>
  <button onclick="showPage('simplifier')">Simplifier</button>
  <button onclick="showPage('history')">Historique</button>
</header>

<!-- ACCUEIL -->
<div id="home" class="container">
  <h1>Assistant IA</h1>
  <p>
    <strong>Explique les textes compliqués simplement.</strong><br><br>
    Collez un courrier, un email, un texte scolaire ou administratif.
  </p>
</div>

<!-- SIMPLIFIER -->
<div id="simplifier" class="container hidden">
  <h2>Simplifier un texte</h2>

  <textarea id="texte" placeholder="Collez votre texte ici..."></textarea>

  <br>
  <button class="action" onclick="simplifier()">Expliquer simplement</button>
  <button class="action" onclick="effacer()">Effacer</button>

  <div id="resultat" class="result"></div>
  <div id="court" class="short"></div>
</div>

<!-- HISTORIQUE -->
<div id="history" class="container hidden">
  <h2>Historique</h2>
  <div id="listeHistorique"></div>
</div>

<script>
  let historique = [];

  function showPage(page) {
    document.getElementById("home").classList.add("hidden");
    document.getElementById("simplifier").classList.add("hidden");
    document.getElementById("history").classList.add("hidden");
    document.getElementById(page).classList.remove("hidden");
  }

  function simplifier() {
    const texte = document.getElementById("texte").value.trim();
    if (texte === "") {
      alert("Veuillez coller un texte.");
      return;
    }

    const explication =
      "Explication simple :\n" +
      "Ce texte a été pris en compte.\n" +
      "L’objectif de l’application est d’expliquer les textes compliqués avec des mots simples.\n\n" +
      "La version intelligente sera disponible plus tard.";

    const court =
      "En bref : le texte est enregistré pour être expliqué simplement.";

    document.getElementById("resultat").innerText = explication;
    document.getElementById("court").innerText = court;

    historique.unshift({
      texte: texte,
      explication: explication
    });

    afficherHistorique();
  }

  function afficherHistorique() {
    const liste = document.getElementById("listeHistorique");
    liste.innerHTML = "";

    historique.forEach((item, index) => {
      const div = document.createElement("div");
      div.className = "history-item";
      div.innerText = item.texte.substring(0, 80) + "...";
      div.onclick = () => {
        showPage("simplifier");
        document.getElementById("texte").value = item.texte;
        document.getElementById("resultat").innerText = item.explication;
        document.getElementById("court").innerText = "";
      };
      liste.appendChild(div);
    });
  }

  function effacer() {
    document.getElementById("texte").value = "";
    document.getElementById("resultat").innerText = "";
    document.getElementById("court").innerText = "";
  }
</script>

</body>
</html>
