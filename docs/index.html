<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant Simple</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.app {
  max-width: 720px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
}

h1, h2 {
  text-align: center;
}

.menu button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
  cursor: pointer;
}

textarea, input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

.section {
  display: none;
}

.resultat {
  background: #eef2f5;
  padding: 12px;
  margin-top: 15px;
  white-space: pre-wrap;
}

button {
  margin-top: 10px;
}

.histo-item {
  background: #eef2f5;
  padding: 10px;
  margin-top: 8px;
  cursor: pointer;
}

.info {
  font-size: 14px;
  color: #555;
  text-align: center;
}
</style>
</head>

<body>

<div class="app">

<!-- MENU -->
<div id="menu" class="menu">
  <h1>Assistant Simple</h1>
  <p class="info">Des outils simples pour écrire et comprendre</p>

  <button onclick="ouvrir('simplifier')">🧠 Simplifier un texte</button>
  <button onclick="ouvrir('resume')">📄 Résumer un texte</button>
  <button onclick="ouvrir('expliquer')">👶 Expliquer simplement</button>
  <button onclick="ouvrir('texte')">✍️ Écrire un texte</button>
  <button onclick="ouvrir('email')">📩 Répondre à un email</button>
  <button onclick="ouvrir('historique')">📜 Historique</button>
</div>

<!-- HISTORIQUE -->
<div id="historique" class="section">
  <h2>📜 Historique</h2>
  <div id="listeHistorique"></div>
  <button onclick="effacerHistorique()">🗑 Effacer l’historique</button>
  <button onclick="retour()">← Retour menu</button>
</div>

<!-- SIMPLIFIER -->
<div id="simplifier" class="section">
  <h2>🧠 Simplifier un texte</h2>
  <textarea id="simpInput"></textarea>
  <button onclick="simplifier()">Simplifier</button>
  <div id="simpResult" class="resultat"></div>
  <button onclick="copier('simpResult')">📋 Copier</button>
  <button onclick="retour()">← Retour menu</button>
</div>

<!-- RESUME -->
<div id="resume" class="section">
  <h2>📄 Résumer un texte</h2>
  <textarea id="resInput"></textarea>
  <button onclick="resumer()">Résumer</button>
  <div id="resResult" class="resultat"></div>
  <button onclick="copier('resResult')">📋 Copier</button>
  <button onclick="retour()">← Retour menu</button>
</div>

<!-- EXPLIQUER -->
<div id="expliquer" class="section">
  <h2>👶 Expliquer simplement</h2>
  <textarea id="expInput"></textarea>
  <button onclick="expliquer()">Expliquer</button>
  <div id="expResult" class="resultat"></div>
  <button onclick="copier('expResult')">📋 Copier</button>
  <button onclick="retour()">← Retour menu</button>
</div>

<!-- TEXTE -->
<div id="texte" class="section">
  <h2>✍️ Écrire un texte</h2>
  <input id="sujet" placeholder="Sujet">
  <button onclick="ecrire()">Générer</button>
  <div id="textResult" class="resultat"></div>
  <button onclick="copier('textResult')">📋 Copier</button>
  <button onclick="retour()">← Retour menu</button>
</div>

<!-- EMAIL -->
<div id="email" class="section">
  <h2>📩 Répondre à un email</h2>
  <textarea id="mailInput"></textarea>
  <button onclick="repondre()">Générer</button>
  <div id="mailResult" class="resultat"></div>
  <button onclick="copier('mailResult')">📋 Copier</button>
  <button onclick="retour()">← Retour menu</button>
</div>

</div>

<script>
function cacherTout() {
  document.querySelectorAll('.section').forEach(s => s.style.display = "none");
  document.getElementById("menu").style.display = "none";
}

function ouvrir(id) {
  cacherTout();
  document.getElementById(id).style.display = "block";
  if (id === "historique") afficherHistorique();
}

function retour() {
  cacherTout();
  document.getElementById("menu").style.display = "block";
}

function sauvegarderHistorique(texte) {
  let histo = JSON.parse(localStorage.getItem("historique")) || [];
  histo.unshift(texte);
  localStorage.setItem("historique", JSON.stringify(histo.slice(0,20)));
}

function afficherHistorique() {
  const zone = document.getElementById("listeHistorique");
  zone.innerHTML = "";
  let histo = JSON.parse(localStorage.getItem("historique")) || [];
  histo.forEach(t => {
    let div = document.createElement("div");
    div.className = "histo-item";
    div.innerText = t.substring(0,100) + "...";
    div.onclick = () => alert(t);
    zone.appendChild(div);
  });
}

function effacerHistorique() {
  localStorage.removeItem("historique");
  afficherHistorique();
}

function simplifier() {
  const r = "Version simplifiée :\n\n" + simpInput.value;
  simpResult.innerText = r;
  sauvegarderHistorique(r);
}

function resumer() {
  const r = "Résumé :\n\n" + resInput.value.split(".").slice(0,2).join(".") + ".";
  resResult.innerText = r;
  sauvegarderHistorique(r);
}

function expliquer() {
  const r = "Explication simple :\n\n" + expInput.value;
  expResult.innerText = r;
  sauvegarderHistorique(r);
}

function ecrire() {
  const r = "Voici un texte clair et simple.";
  textResult.innerText = r;
  sauvegarderHistorique(r);
}

function repondre() {
  const r = "Merci pour votre message.";
  mailResult.innerText = r;
  sauvegarderHistorique(r);
}

function copier(id) {
  navigator.clipboard.writeText(document.getElementById(id).innerText);
  alert("Texte copié");
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
