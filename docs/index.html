<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Assistant IA</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
    }
    .application {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border-radius: 10px;
    }
    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    #reponse {
      margin-top: 20px;
      padding: 10px;
      background: #eef;
      min-height: 60px;
      white-space: pre-wrap;
    }
    li {
      cursor: pointer;
      padding: 6px;
      border-bottom: 1px solid #ccc;
    }
    li:hover {
      background: #eee;
    }
  </style>
</head>

<body>

<div class="application">
  <h1>Assistant IA</h1>

<div id="accueil">
  <h1>🤖 Assistant IA simple</h1>
  <p>
    Des outils simples pour écrire, répondre et gagner du temps,
    même si vous ne connaissez rien à l’IA.
  </p>

  <button onclick="ouvrirOutil()">✍️ Écrire un texte</button>
  <br><br>
  <button onclick="ouvrirEmail()">📩 Répondre à un email</button>

  <p style="margin-top:20px;font-size:12px;color:gray;">
    Aucune inscription • Gratuit • Données non stockées
  </p>
</div>


  <!-- OUTIL -->
  <div id="outil" style="display:none;">
    <h2>✍️ Écrire un texte</h2>

    <label>Sujet du texte</label>
    <input id="sujet" placeholder="Ex : demande de rendez-vous">

    <label>À qui s’adresse le texte</label>
    <input id="destinataire" placeholder="Ex : mon employeur">

    <label>Ton</label>
    <select id="ton">
      <option>Simple</option>
      <option>Professionnel</option>
      <option>Amical</option>
    </select>

    <label>Longueur</label>
    <select id="longueur">
      <option>Court</option>
      <option>Moyen</option>
      <option>Long</option>
    </select>

    <button onclick="genererTexte()">Générer le texte</button>
    <button onclick="retour()">← Retour</button>

    <!-- RÉPONSE -->
    <div id="reponse"></div>

    <!-- HISTORIQUE -->
    <h3>Historique</h3>
    <ul id="historique"></ul>
  </div>
</div>

<script>
let historique = JSON.parse(localStorage.getItem("historique")) || [];

function ouvrirOutil() {
  document.getElementById("accueil").style.display = "none";
  document.getElementById("outil").style.display = "block";
}

function retour() {
  document.getElementById("outil").style.display = "none";
  document.getElementById("accueil").style.display = "block";
}

function genererTexte() {
  const sujet = document.getElementById("sujet").value;
  const dest = document.getElementById("destinataire").value;
  const ton = document.getElementById("ton").value;
  const longueur = document.getElementById("longueur").value;

  const texte =
`Objet : ${sujet}

Bonjour,

Voici un message ${ton.toLowerCase()} destiné à ${dest}.
Le texte est volontairement ${longueur.toLowerCase()}.

Cordialement.`;

  document.getElementById("reponse").textContent = texte;

  historique.unshift(texte);
  localStorage.setItem("historique", JSON.stringify(historique));
  afficherHistorique();
}

function afficherHistorique() {
  const ul = document.getElementById("historique");
  ul.innerHTML = "";

  historique.forEach((texte) => {
    const li = document.createElement("li");
    li.textContent = texte.substring(0, 40) + "...";
    li.onclick = () => {
      document.getElementById("reponse").textContent = texte;
    };
    ul.appendChild(li);
  });
}

afficherHistorique();
</script>

</body>
</html>
