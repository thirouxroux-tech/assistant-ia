<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Assistant IA – Simplifier un texte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 10px;
      font-size: 16px;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eef;
      border-radius: 5px;
      white-space: pre-line;
    }

    .short {
      margin-top: 10px;
      padding: 10px;
      background: #e0ffe0;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Assistant IA</h1>
    <p><strong>Collez un texte compliqué. On vous l’explique simplement.</strong></p>

    <textarea id="texte" placeholder="Collez votre texte ici..."></textarea>

    <br>

    <button onclick="simplifier()">Expliquer simplement</button>
    <button onclick="effacer()">Effacer</button>

    <div id="resultat" class="result"></div>
    <div id="court" class="short"></div>
  </div>

  <script>
    function simplifier() {
      const texte = document.getElementById("texte").value.trim();

      if (texte === "") {
        alert("Veuillez coller un texte.");
        return;
      }

      document.getElementById("resultat").innerText =
        "Explication simple :\n" +
        "Ce texte a bien été pris en compte.\n\n" +
        "L’objectif de cette application est d’expliquer les textes compliqués avec des mots simples.\n" +
        "La version intelligente sera disponible prochainement.";

      document.getElementById("court").innerText =
        "En bref : ce texte est enregistré et sera expliqué simplement.";
    }

    function effacer() {
      document.getElementById("texte").value = "";
      document.getElementById("resultat").innerText = "";
      document.getElementById("court").innerText = "";
    }
  </script>

</body>
</html>
