<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant IA</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.application {
  max-width: 600px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  font-size: 16px;
  cursor: pointer;
}

textarea, input, select {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
}

.section {
  display: none;
}

.resultat {
  background: #f0f0f0;
  padding: 10px;
  margin-top: 10px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="application">

<!-- ACCUEIL -->
<div id="accueil">
  <h1>Assistant IA</h1>
  <p>Des outils simples pour tous</p>

  <button onclick="ouvrirTexte()">✍️ Écrire un texte</button>
  <button onclick="ouvrirEmail()">📩 Répondre à un email</button>
  <button onclick="ouvrirResume()">📄 Résumer un texte</button>
  <button onclick="ouvrirSimplifier()">🧠 Simplifier un texte</button>
</div>

<!-- ECRIRE TEXTE -->
<div id="outilTexte" class="section">
  <h2>✍️ Écrire un texte</h2>
  <input id="sujet" placeholder="Sujet">
  <input id="destinataire" placeholder="À qui ?">
  <button onclick="genererTexte()">Générer</button>
  <div id="reponseTexte" class="resultat"></div>
  <button onclick="copier('reponseTexte')">Copier</button>
  <button onclick="retourAccueil()">← Retour</button>
</div>

<!-- EMAIL -->
<div id="outilEmail" class="section">
  <h2>📩 Répondre à un email</h2>
  <textarea id="emailRecu" placeholder="Collez l'email ici"></textarea>
  <button onclick="genererEmail()">Générer</button>
  <div id="reponseEmail" class="resultat"></div>
  <button onclick="copier('reponseEmail')">Copier</button>
  <button onclick="retourAccueil()">← Retour</button>
</div>

<!-- RESUME -->
<div id="outilResume" class="section">
  <h2>📄 Résumer un texte</h2>
  <textarea id="texteResume" placeholder="Texte à résumer"></textarea>
  <button onclick="genererResume()">Résumer</button>
  <div id="reponseResume" class="resultat"></div>
  <button onclick="copier('reponseResume')">Copier</button>
  <button onclick="retourAccueil()">← Retour</button>
</div>

<!-- SIMPLIFIER -->
<div id="outilSimplifier" class="section">
  <h2>🧠 Simplifier un texte</h2>
  <textarea id="texteComplexe" placeholder="Texte compliqué"></textarea>
  <button onclick="genererSimplification()">Simplifier</button>
  <div id="reponseSimplifiee" class="resultat"></div>
  <button onclick="copier('reponseSimplifiee')">Copier</button>
  <button onclick="retourAccueil()">← Retour</button>
</div>

</div>

<script>
function cacherTout() {
  document.getElementById("accueil").style.display = "none";
  document.getElementById("outilTexte").style.display = "none";
  document.getElementById("outilEmail").style.display = "none";
  document.getElementById("outilResume").style.display = "none";
  document.getElementById("outilSimplifier").style.display = "none";
}

function retourAccueil() {
  cacherTout();
  document.getElementById("accueil").style.display = "block";
}

function ouvrirTexte() {
  cacherTout();
  document.getElementById("outilTexte").style.display = "block";
}

function ouvrirEmail() {
  cacherTout();
  document.getElementById("outilEmail").style.display = "block";
}

function ouvrirResume() {
  cacherTout();
  document.getElementById("outilResume").style.display = "block";
}

function ouvrirSimplifier() {
  cacherTout();
  document.getElementById("outilSimplifier").style.display = "block";
}

function genererTexte() {
  const sujet = document.getElementById("sujet").value;
  const dest = document.getElementById("destinataire").value;
  document.getElementById("reponseTexte").innerText =
    "Bonjour,\n\nVoici un texte concernant : " + sujet +
    "\nDestinataire : " + dest + ".\n\nCordialement.";
}

function genererEmail() {
  document.getElementById("reponseEmail").innerText =
    "Bonjour,\n\nMerci pour votre message.\n\nCordialement.";
}

function genererResume() {
  const texte = document.getElementById("texteResume").value;
  document.getElementById("reponseResume").innerText =
    texte.split(".").slice(0, 2).join(".") + ".";
}

function genererSimplification() {
  const texte = document.getElementById("texteComplexe").value;
  document.getElementById("reponseSimplifiee").innerText =
    "Version simple :\n" + texte;
}

function copier(id) {
  const texte = document.getElementById(id).innerText;
  navigator.clipboard.writeText(texte);
  alert("Texte copié");
}
</script>

</body>
</html>
