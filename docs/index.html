<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant Simple</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.app {
  max-width: 700px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
}

.menu button {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  font-size: 16px;
  cursor: pointer;
}

.section {
  display: none;
}

textarea, input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

.resultat {
  background: #eef2f5;
  padding: 12px;
  margin-top: 15px;
  white-space: pre-wrap;
}

.info {
  color: #555;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="app">

<!-- MENU -->
<div id="menu" class="menu">
  <h1>Assistant Simple</h1>
  <p class="info">Choisissez un outil</p>

  <button onclick="ouvrir('simplifier')">🧠 Simplifier un texte</button>
  <button onclick="ouvrir('resume')">📄 Résumer un texte</button>
  <button onclick="ouvrir('texte')">✍️ Écrire un texte</button>
  <button onclick="ouvrir('email')">📩 Répondre à un email</button>
</div>

<!-- SIMPLIFIER -->
<div id="simplifier" class="section">
  <h2>🧠 Simplifier un texte</h2>
  <textarea id="simpInput"></textarea>
  <button onclick="simplifier()">Simplifier</button>
  <div id="simpResult" class="resultat"></div>
  <button onclick="retour()">← Retour menu</button>
</div>

<!-- RESUME -->
<div id="resume" class="section">
  <h2>📄 Résumer un texte</h2>
  <textarea id="resInput"></textarea>
  <button onclick="resumer()">Résumer</button>
  <div id="resResult" class="resultat"></div>
  <button onclick="retour()">← Retour menu</button>
</div>

<!-- TEXTE -->
<div id="texte" class="section">
  <h2>✍️ Écrire un texte</h2>
  <input id="sujet" placeholder="Sujet">
  <input id="dest" placeholder="Destinataire">
  <button onclick="ecrire()">Générer</button>
  <div id="textResult" class="resultat"></div>
  <button onclick="retour()">← Retour menu</button>
</div>

<!-- EMAIL -->
<div id="email" class="section">
  <h2>📩 Répondre à un email</h2>
  <textarea id="mailInput"></textarea>
  <button onclick="repondre()">Générer réponse</button>
  <div id="mailResult" class="resultat"></div>
  <button onclick="retour()">← Retour menu</button>
</div>

</div>

<script>
function cacherTout() {
  document.querySelectorAll('.section').forEach(s => s.style.display = "none");
  document.getElementById("menu").style.display = "none";
}

function ouvrir(id) {
  cacherTout();
  document.getElementById(id).style.display = "block";
}

function retour() {
  cacherTout();
  document.getElementById("menu").style.display = "block";
}

function simplifier() {
  document.getElementById("simpResult").innerText =
    "Version simplifiée :\n\n" +
    document.getElementById("simpInput").value;
}

function resumer() {
  const t = document.getElementById("resInput").value;
  document.getElementById("resResult").innerText =
    t.split(".").slice(0,2).join(".") + ".";
}

function ecrire() {
  document.getElementById("textResult").innerText =
    "Bonjour,\n\nVoici votre texte.\n\nCordialement.";
}

function repondre() {
  document.getElementById("mailResult").innerText =
    "Bonjour,\n\nMerci pour votre message.\n\nCordialement.";
}
</script>

</body>
</html>
