<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant Simple</title>
<link rel="manifest" href="manifest.json">

<style>
body {
  font-family: Arial, sans-serif;
  background: #eef1f4;
}

.app {
  max-width: 720px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
}

h1, h2 {
  text-align: center;
}

.menu button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
}

textarea, input {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
}

.section {
  display: none;
}

.resultat {
  background: #f0f3f6;
  padding: 12px;
  margin-top: 15px;
  white-space: pre-wrap;
  border-radius: 6px;
}

button {
  margin-top: 10px;
}

.histo-item {
  background: #f0f3f6;
  padding: 10px;
  margin-top: 8px;
  cursor: pointer;
  border-radius: 6px;
}

.info {
  font-size: 14px;
  color: #555;
  text-align: center;
}

.counter {
  text-align: center;
  font-size: 14px;
  margin-bottom: 15px;
  color: #333;
}
</style>
</head>

<body>

<div class="app">

<div id="menu" class="menu">
  <h1>Assistant Simple</h1>
  <p class="info">Des outils simples pour écrire, comprendre et répondre</p>
  <p id="compteur" class="counter"></p>

  <button onclick="ouvrir('simplifier')">🧠 Simplifier un texte</button>
  <button onclick="ouvrir('resume')">📄 Résumer un texte</button>
  <button onclick="ouvrir('expliquer')">👶 Expliquer simplement</button>
  <button onclick="ouvrir('texte')">✍️ Écrire un texte</button>
  <button onclick="ouvrir('email')">📩 Répondre à un email</button>
  <button onclick="ouvrir('historique')">📜 Historique</button>
</div>

<div id="historique" class="section">
  <h2>📜 Historique</h2>
  <div id="listeHistorique"></div>
  <button onclick="effacerHistorique()">🗑 Effacer</button>
  <button onclick="retour()">← Menu</button>
</div>

<div id="simplifier" class="section">
  <h2>🧠 Simplifier un texte</h2>
  <textarea id="simpInput"></textarea>
  <button onclick="action(() => simpInput.value)">Simplifier</button>
  <div id="simpResult" class="resultat"></div>
  <button onclick="copier('simpResult')">📋 Copier</button>
  <button onclick="retour()">← Menu</button>
</div>

<div id="resume" class="section">
  <h2>📄 Résumer un texte</h2>
  <textarea id="resInput"></textarea>
  <button onclick="action(() => resInput.value.split('.').slice(0,2).join('.') + '.')">Résumer</button>
  <div id="resResult" class="resultat"></div>
  <button onclick="copier('resResult')">📋 Copier</button>
  <button onclick="retour()">← Menu</button>
</div>

<div id="expliquer" class="section">
  <h2>👶 Expliquer simplement</h2>
  <textarea id="expInput"></textarea>
  <button onclick="action(() => expInput.value)">Expliquer</button>
  <div id="expResult" class="resultat"></div>
  <button onclick="copier('expResult')">📋 Copier</button>
  <button onclick="retour()">← Menu</button>
</div>

<div id="texte" class="section">
  <h2>✍️ Écrire un texte</h2>
  <input id="sujet" placeholder="Sujet">
  <button onclick="action(() => 'Texte clair sur : ' + sujet.value)">Générer</button>
  <div id="textResult" class="resultat"></div>
  <button onclick="copier('textResult')">📋 Copier</button>
  <button onclick="retour()">← Menu</button>
</div>

<div id="email" class="section">
  <h2>📩 Répondre à un email</h2>
  <textarea id="mailInput"></textarea>
  <button onclick="action(() => 'Merci pour votre message.')">Répondre</button>
  <div id="mailResult" class="resultat"></div>
  <button onclick="copier('mailResult')">📋 Copier</button>
  <button onclick="retour()">← Menu</button>
</div>

</div>

<script>
const MAX = 5;

function getData() {
  return JSON.parse(localStorage.getItem("usage")) || {date:"",count:0};
}

function saveData(d){ localStorage.setItem("usage",JSON.stringify(d)); }

function canUse(){
  const today = new Date().toDateString();
  let d = getData();
  if(d.date !== today){ d = {date:today,count:0}; saveData(d); }
  return d.count < MAX;
}

function useOnce(){
  let d = getData();
  d.count++;
  saveData(d);
  updateCounter();
}

function updateCounter(){
  const d = getData();
  document.getElementById("compteur").innerText =
    "Utilisations restantes aujourd’hui : " + (MAX - d.count);
}

updateCounter();

function cacherTout(){
  document.querySelectorAll('.section').forEach(s=>s.style.display="none");
  menu.style.display="none";
}

function ouvrir(id){
  cacherTout();
  document.getElementById(id).style.display="block";
  if(id==="historique") afficherHistorique();
}

function retour(){
  cacherTout();
  menu.style.display="block";
}

function action(fn){
  if(!canUse()){ alert("Limite atteinte. Revenez demain."); return; }
  const r = fn();
  document.querySelector(".section[style*='block'] .resultat").innerText = r;
  sauvegarder(r);
  useOnce();
}

function sauvegarder(t){
  let h = JSON.parse(localStorage.getItem("historique")) || [];
  h.unshift(t);
  localStorage.setItem("historique",JSON.stringify(h.slice(0,20)));
}

function afficherHistorique(){
  const z = listeHistorique;
  z.innerHTML="";
  (JSON.parse(localStorage.getItem("historique"))||[]).forEach(t=>{
    const d=document.createElement("div");
    d.className="histo-item";
    d.innerText=t.substring(0,80)+"...";
    d.onclick=()=>alert(t);
    z.appendChild(d);
  });
}

function effacerHistorique(){
  localStorage.removeItem("historique");
  afficherHistorique();
}

function copier(id){
  navigator.clipboard.writeText(document.getElementById(id).innerText);
  alert("Texte copié");
}

if("serviceWorker"in navigator){
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
