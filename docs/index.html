<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant Simple</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.app {
  max-width: 600px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
}

h1 {
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  font-size: 16px;
  cursor: pointer;
}

textarea {
  width: 100%;
  height: 140px;
  padding: 10px;
  margin-top: 10px;
}

.section {
  display: none;
}

.resultat {
  background: #eef2f5;
  padding: 12px;
  margin-top: 15px;
  border-radius: 6px;
  white-space: pre-wrap;
}

.info {
  font-size: 14px;
  color: #555;
  margin-bottom: 10px;
}

.success {
  color: green;
  font-size: 14px;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="app">

<!-- ACCUEIL -->
<div id="accueil">
  <h1>Comprendre plus facilement</h1>
  <p class="info">
    Collez un texte compliqué (courrier, email, consigne…).  
    L’assistant va vous l’expliquer simplement.
  </p>

  <button onclick="ouvrirSimplifier()">🧠 Simplifier un texte</button>
</div>

<!-- OUTIL SIMPLIFIER -->
<div id="outilSimplifier" class="section">
  <h2>🧠 Simplifier un texte</h2>

  <p class="info">
    Collez ci-dessous un texte difficile à comprendre.  
    Vous obtiendrez une version plus simple et plus claire.
  </p>

  <textarea id="texteComplexe" placeholder="Collez votre texte ici..."></textarea>

  <button onclick="simplifierTexte()">Simplifier</button>

  <div id="etat" class="info"></div>

  <div id="reponse" class="resultat"></div>

  <button onclick="copierTexte()">📋 Copier le texte simplifié</button>
  <div id="copieOK" class="success"></div>

  <button onclick="retourAccueil()">← Retour à l’accueil</button>
</div>

</div>

<script>
function ouvrirSimplifier() {
  document.getElementById("accueil").style.display = "none";
  document.getElementById("outilSimplifier").style.display = "block";
}

function retourAccueil() {
  document.getElementById("outilSimplifier").style.display = "none";
  document.getElementById("accueil").style.display = "block";
}

function simplifierTexte() {
  const texte = document.getElementById("texteComplexe").value;

  if (texte.trim() === "") {
    alert("Veuillez coller un texte.");
    return;
  }

  document.getElementById("etat").innerText = "Analyse en cours...";
  document.getElementById("reponse").innerText = "";
  document.getElementById("copieOK").innerText = "";

  setTimeout(() => {
    document.getElementById("etat").innerText = "";
    document.getElementById("reponse").innerText =
      "Version simplifiée :\n\n" + texte;
  }, 800);
}

function copierTexte() {
  const texte = document.getElementById("reponse").innerText;

  if (texte.trim() === "") {
    alert("Aucun texte à copier.");
    return;
  }

  navigator.clipboard.writeText(texte);
  document.getElementById("copieOK").innerText = "✅ Texte copié";
}
</script>

</body>
</html>
