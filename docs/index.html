<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant Simple</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
}

.app {
  max-width: 650px;
  margin: 40px auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
}

h1, h2 {
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  font-size: 16px;
  cursor: pointer;
}

textarea, input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

.section {
  display: none;
}

.info {
  font-size: 14px;
  color: #555;
  margin-bottom: 10px;
}

.resultat {
  background: #eef2f5;
  padding: 12px;
  margin-top: 15px;
  border-radius: 6px;
  white-space: pre-wrap;
}

.success {
  color: green;
  font-size: 14px;
  margin-top: 5px;
}
</style>
</head>

<body>

<div class="app">

<!-- ACCUEIL -->
<div id="accueil">
  <h1>Assistant Simple</h1>
  <p class="info">
    Comprendre, écrire et répondre plus facilement.  
    Sans jargon, sans inscription.
  </p>

  <button onclick="ouvrir('simplifier')">🧠 Simplifier un texte</button>
  <button onclick="ouvrir('resume')">📄 Résumer un texte</button>
  <button onclick="ouvrir('texte')">✍️ Écrire un texte</button>
  <button onclick="ouvrir('email')">📩 Répondre à un email</button>
</div>

<!-- SIMPLIFIER -->
<div id="simplifier" class="section">
  <h2>🧠 Simplifier un texte</h2>
  <p class="info">Collez un texte compliqué, il sera expliqué simplement.</p>
  <textarea id="simpInput"></textarea>
  <button onclick="simplifier()">Simplifier</button>
  <div id="simpResult" class="resultat"></div>
  <button onclick="copier('simpResult')">📋 Copier</button>
  <div id="simpOK" class="success"></div>
  <button onclick="retour()">← Retour</button>
</div>

<!-- RESUME -->
<div id="resume" class="section">
  <h2>📄 Résumer un texte</h2>
  <p class="info">Collez un texte long pour obtenir l’essentiel.</p>

  <button onclick="resumer()">Résumer</button>
  <div id="resResult" class="resultat"></div>
  <button onclick="copier('resResult')">📋 Copier</button>
  <button onclick="retour()">← Retour</button>
</div>
